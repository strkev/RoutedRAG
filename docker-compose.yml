services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: routed-rag-agent
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./.env:/app/.env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
